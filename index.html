<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Firma del Tutor — Coformación Empresarial</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0f2f5; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .card {
      background: #fff; border-radius: 16px; padding: 36px;
      width: 100%; max-width: 480px; box-shadow: 0 8px 32px rgba(0,0,0,0.10);
    }
    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .logo-circle {
      width: 42px; height: 42px; background: #1a3557; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .logo-circle svg { width: 22px; height: 22px; fill: #fff; }
    .header-text h1 { font-size: 17px; font-weight: 700; color: #1a3557; }
    .header-text p  { font-size: 12px; color: #8a96a3; margin-top: 2px; }
    .divider { height: 1px; background: #edf0f4; margin-bottom: 24px; }

    .step { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 22px; }
    .step-num {
      width: 24px; height: 24px; background: #1a3557; color: #fff;
      font-size: 12px; font-weight: 700; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 2px;
    }
    .step-body { flex: 1; }
    .field-label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 7px; }

    input[type="text"] {
      width: 100%; padding: 11px 14px;
      border: 1.5px solid #d1d5db; border-radius: 10px;
      font-size: 15px; font-family: 'Courier New', monospace;
      font-weight: 600; letter-spacing: 1px; color: #1a3557;
      outline: none; transition: border-color .2s; text-transform: uppercase;
    }
    input[type="text"]::placeholder { font-weight: 400; letter-spacing: 0; color: #b0b8c1; font-family: 'Segoe UI', sans-serif; }
    input[type="text"]:focus { border-color: #1a3557; box-shadow: 0 0 0 3px rgba(26,53,87,.10); }

    /* ── Documentos ── */
    .docs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .doc-check {
      display: flex; align-items: center; gap: 8px;
      background: #f8fafc; border: 1.5px solid #e2e8f0;
      border-radius: 8px; padding: 10px 12px;
      cursor: pointer; transition: border-color .2s, background .2s;
      user-select: none;
    }
    .doc-check:hover { border-color: #1a3557; background: #EAF0FA; }
    .doc-check.selected { border-color: #1a3557; background: #EAF0FA; }
    .check-box {
      width: 18px; height: 18px; border: 2px solid #d1d5db;
      border-radius: 4px; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all .2s; background: #fff; position: relative;
    }
    .doc-check.selected .check-box { border-color: #1a3557; background: #1a3557; }
    .check-box::after {
      content: ''; width: 10px; height: 6px;
      border-left: 2px solid #fff; border-bottom: 2px solid #fff;
      transform: rotate(-45deg) translateY(-1px); display: none;
    }
    .doc-check.selected .check-box::after { display: block; }
    .doc-check span { font-size: 12px; font-weight: 500; color: #374151; line-height: 1.3; }
    .doc-check.selected span { color: #1a3557; }
    .sel-actions { display: flex; gap: 10px; margin-top: 8px; }
    .sel-actions button {
      font-size: 11px; color: #6b7280; background: none;
      border: none; cursor: pointer; text-decoration: underline; padding: 0;
    }
    .sel-actions button:hover { color: #1a3557; }

    /* ── Firma ── */
    .firma-badge {
      display: none; align-items: center; gap: 8px;
      background: #ecfdf5; border: 1px solid #a7f3d0;
      border-radius: 8px; padding: 8px 12px; margin-bottom: 10px;
      font-size: 13px; color: #065f46;
    }
    .firma-badge.visible { display: flex; }
    .firma-badge strong { flex: 1; }
    .firma-badge button { background: none; border: none; color: #065f46; font-size: 12px; cursor: pointer; text-decoration: underline; }

    .canvas-wrap {
      border: 1.5px solid #d1d5db; border-radius: 10px;
      overflow: hidden; background: #fafbfc;
      position: relative; cursor: crosshair; touch-action: none;
    }
    .canvas-wrap.guardada { border-color: #6ee7b7; background: #f0fdf9; }
    canvas { display: block; width: 100%; }
    .canvas-hint {
      position: absolute; bottom: 8px; left: 0; right: 0;
      text-align: center; font-size: 11px; color: #c0c8d0;
      pointer-events: none; transition: opacity .3s;
    }
    .canvas-hint.oculto { opacity: 0; }

    .acciones { display: flex; gap: 8px; margin-top: 10px; margin-bottom: 24px; }
    .btn-sec {
      padding: 9px 14px; border: 1.5px solid #d1d5db; border-radius: 8px;
      background: #fff; color: #6b7280; font-size: 13px; font-weight: 500;
      cursor: pointer; white-space: nowrap;
    }
    .btn-sec:hover { background: #f3f4f6; }
    .btn-verde { border-color: #059669; color: #059669; display: none; }
    .btn-verde:hover { background: #ecfdf5; }

    .btn-enviar {
      width: 100%; padding: 13px; border: none; border-radius: 10px;
      background: #1a3557; color: #fff; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: background .2s, transform .1s;
    }
    .btn-enviar:hover:not(:disabled)  { background: #243f6e; }
    .btn-enviar:active:not(:disabled) { transform: scale(.98); }
    .btn-enviar:disabled { background: #9ca3af; cursor: not-allowed; }

    .msg {
      display: none; margin-top: 18px; padding: 14px 16px;
      border-radius: 10px; font-size: 14px; line-height: 1.5; text-align: center;
    }
    .msg.ok  { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .msg.err { background: #fef2f2; color: #991b1b; border: 1px solid #fca5a5; }

    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.4); border-top-color: #fff;
      border-radius: 50%; animation: spin .7s linear infinite;
      margin-right: 8px; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .footer { margin-top: 24px; text-align: center; font-size: 11px; color: #b0b8c1; }
  </style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="logo-circle">
      <svg viewBox="0 0 24 24"><path d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/></svg>
    </div>
    <div class="header-text">
      <h1>Firma del Tutor</h1>
      <p>Uniempresarial — Coformación Empresarial</p>
    </div>
  </div>
  <div class="divider"></div>

  <!-- Paso 1 -->
  <div class="step">
    <div class="step-num">1</div>
    <div class="step-body">
      <label class="field-label" for="codigo">Código del acta</label>
      <input type="text" id="codigo" placeholder="ACT-2025-001" maxlength="16"/>
    </div>
  </div>

  <!-- Paso 2 -->
  <div class="step">
    <div class="step-num">2</div>
    <div class="step-body">
      <label class="field-label">Documentos a firmar</label>
      <div class="docs-grid">
        <div class="doc-check selected" data-key="actaInicio" onclick="toggleDoc(this)">
          <div class="check-box"></div><span>Acta de Inicio</span>
        </div>
        <div class="doc-check selected" data-key="actaSeguimiento" onclick="toggleDoc(this)">
          <div class="check-box"></div><span>Acta de Seguimiento</span>
        </div>
        <div class="doc-check selected" data-key="actaCierre" onclick="toggleDoc(this)">
          <div class="check-box"></div><span>Acta de Cierre</span>
        </div>
        <div class="doc-check selected" data-key="planActividades" onclick="toggleDoc(this)">
          <div class="check-box"></div><span>Plan de Actividades</span>
        </div>
        <div class="doc-check selected" data-key="evalTutor" onclick="toggleDoc(this)">
          <div class="check-box"></div><span>Evaluación del Tutor</span>
        </div>
      </div>
      <div class="sel-actions">
        <button onclick="seleccionarTodos()">Seleccionar todos</button>
        <span style="color:#d1d5db">·</span>
        <button onclick="deseleccionarTodos()">Deseleccionar todos</button>
      </div>
    </div>
  </div>

  <!-- Paso 3 -->
  <div class="step">
    <div class="step-num">3</div>
    <div class="step-body">
      <label class="field-label">Tu firma</label>
      <div class="firma-badge" id="firmaBadge">
        <span>✅</span>
        <strong>Firma guardada cargada automáticamente</strong>
        <button onclick="pedirRedibujar()">Cambiar</button>
      </div>
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="canvas" height="150"></canvas>
        <span class="canvas-hint" id="hint">Dibuja aquí tu firma con el dedo o el mouse</span>
      </div>
      <div class="acciones">
        <button class="btn-sec" onclick="limpiar()">Limpiar</button>
        <button class="btn-sec btn-verde" id="btnRestaurar" onclick="restaurarGuardada()">Restaurar guardada</button>
      </div>
    </div>
  </div>

  <button class="btn-enviar" id="btnEnviar" onclick="enviar()">Registrar firma</button>
  <div class="msg" id="msg"></div>
  <div class="footer">Tus datos están protegidos · Uniempresarial</div>
</div>

<script>
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz6EMdd3vOHJkYN9aSixYV90BJ-NxBKMv7NTpq76hG51l8w_nNTJKhSQC_tHnOGeBXt5A/exec';
  const STORAGE_KEY     = 'coformacion_firma_tutor';

  const canvas       = document.getElementById('canvas');
  const ctx          = canvas.getContext('2d');
  const hint         = document.getElementById('hint');
  const badge        = document.getElementById('firmaBadge');
  const canvasWrap   = document.getElementById('canvasWrap');
  const btnRestaurar = document.getElementById('btnRestaurar');

  let dibujando     = false;
  let haFirmado     = false;
  let firmaGuardada = null;

  // ── Canvas ─────────────────────────────────────────────────
  function initCanvas() {
    canvas.width  = canvas.offsetWidth;
    canvas.height = 150;
    ctx.strokeStyle = '#1a3557';
    ctx.lineWidth   = 2.5;
    ctx.lineCap     = 'round';
    ctx.lineJoin    = 'round';
  }

  // ── Compresión ─────────────────────────────────────────────
  // Reduce la firma a 300x80px en JPEG calidad 0.4 → menos de 8KB
  function comprimirFirma() {
    const temp = document.createElement('canvas');
    temp.width  = 300;
    temp.height = 80;
    const tCtx = temp.getContext('2d');
    tCtx.fillStyle = '#ffffff';
    tCtx.fillRect(0, 0, 300, 80);
    tCtx.drawImage(canvas, 0, 0, 300, 80);
    return temp.toDataURL('image/jpeg', 0.4);
  }

  // ── Caché ──────────────────────────────────────────────────
  function cargarFirmaGuardada() {
    try {
      const g = localStorage.getItem(STORAGE_KEY);
      if (!g) return;
      firmaGuardada = g;
      const img = new Image();
      img.onload = () => {
        initCanvas();
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        haFirmado = true;
        hint.classList.add('oculto');
        badge.classList.add('visible');
        canvasWrap.classList.add('guardada');
      };
      img.src = g;
    } catch(e) {}
  }

  function guardarEnCache(b64) {
    try { localStorage.setItem(STORAGE_KEY, b64); firmaGuardada = b64; } catch(e) {}
  }

  function pedirRedibujar() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    haFirmado = false;
    hint.classList.remove('oculto');
    badge.classList.remove('visible');
    canvasWrap.classList.remove('guardada');
    btnRestaurar.style.display = firmaGuardada ? 'block' : 'none';
    ocultarMensaje();
  }

  function restaurarGuardada() {
    if (!firmaGuardada) return;
    const img = new Image();
    img.onload = () => {
      initCanvas();
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      haFirmado = true;
      hint.classList.add('oculto');
      badge.classList.add('visible');
      canvasWrap.classList.add('guardada');
      btnRestaurar.style.display = 'none';
    };
    img.src = firmaGuardada;
  }

  function limpiar() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    haFirmado = false;
    hint.classList.remove('oculto');
    badge.classList.remove('visible');
    canvasWrap.classList.remove('guardada');
    btnRestaurar.style.display = firmaGuardada ? 'block' : 'none';
    ocultarMensaje();
  }

  // ── Dibujar ────────────────────────────────────────────────
  function getXY(e) {
    const r = canvas.getBoundingClientRect();
    const s = e.touches ? e.touches[0] : e;
    return {
      x: (s.clientX - r.left) * (canvas.width  / r.width),
      y: (s.clientY - r.top)  * (canvas.height / r.height),
    };
  }
  function iniciar(e) {
    dibujando = true; haFirmado = true;
    hint.classList.add('oculto');
    badge.classList.remove('visible');
    canvasWrap.classList.remove('guardada');
    const p = getXY(e); ctx.beginPath(); ctx.moveTo(p.x, p.y);
  }
  function dibujar(e) {
    if (!dibujando) return; e.preventDefault();
    const p = getXY(e); ctx.lineTo(p.x, p.y); ctx.stroke();
  }
  function detener() { dibujando = false; }

  canvas.addEventListener('mousedown',  iniciar);
  canvas.addEventListener('mousemove',  dibujar);
  canvas.addEventListener('mouseup',    detener);
  canvas.addEventListener('mouseleave', detener);
  canvas.addEventListener('touchstart', iniciar, { passive: false });
  canvas.addEventListener('touchmove',  dibujar, { passive: false });
  canvas.addEventListener('touchend',   detener);

  // ── Selección documentos ────────────────────────────────────
  function toggleDoc(el) { el.classList.toggle('selected'); }
  function seleccionarTodos()   { document.querySelectorAll('.doc-check').forEach(el => el.classList.add('selected')); }
  function deseleccionarTodos() { document.querySelectorAll('.doc-check').forEach(el => el.classList.remove('selected')); }
  function getDocumentosSeleccionados() {
    return Array.from(document.querySelectorAll('.doc-check.selected')).map(el => el.dataset.key);
  }

  // ── UI ─────────────────────────────────────────────────────
  function mostrarMensaje(texto, tipo) {
    const el = document.getElementById('msg');
    el.innerHTML = texto; el.className = `msg ${tipo}`; el.style.display = 'block';
  }
  function ocultarMensaje() { document.getElementById('msg').style.display = 'none'; }
  function canvasVacio() {
    return !ctx.getImageData(0, 0, canvas.width, canvas.height).data.some(v => v !== 0);
  }

  // ── Envío ──────────────────────────────────────────────────
  async function enviar() {
    ocultarMensaje();

    const codigo = document.getElementById('codigo').value.trim().toUpperCase();
    const docs   = getDocumentosSeleccionados();

    if (!codigo) {
      mostrarMensaje('Por favor ingresa el código del acta.', 'err'); return;
    }
    if (!/^ACT-\d{4}-\d{3}$/.test(codigo)) {
      mostrarMensaje('El código debe tener el formato <strong>ACT-2025-001</strong>.', 'err'); return;
    }
    if (docs.length === 0) {
      mostrarMensaje('Selecciona al menos un documento para firmar.', 'err'); return;
    }
    if (canvasVacio()) {
      mostrarMensaje('Por favor dibuja tu firma antes de continuar.', 'err'); return;
    }

    const btn = document.getElementById('btnEnviar');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Enviando…';

    // Comprimir firma antes de enviar → menos de 8KB
    const firmaComprimida = comprimirFirma();

    const nombresDoc = {
      actaInicio:      'Acta de Inicio',
      actaSeguimiento: 'Acta de Seguimiento',
      actaCierre:      'Acta de Cierre',
      planActividades: 'Plan de Actividades',
      evalTutor:       'Evaluación del Tutor',
    };

    const params = new URLSearchParams({
      action:      'firmarTutor',
      codigoActa:  codigo,
      documentos:  docs.join(','),
      firmaBase64: firmaComprimida,
    });

    try {
      await fetch(APPS_SCRIPT_URL + '?' + params.toString(), {
        method: 'GET',
        mode:   'no-cors',
      });

      // Guardar en caché la firma original (mayor calidad para visualización)
      guardarEnCache(canvas.toDataURL('image/png'));

      const listaFirmada = docs.map(k => nombresDoc[k]).join(', ');
      mostrarMensaje(
        '✅ <strong>¡Firma enviada correctamente!</strong><br>' +
        'Documentos: <strong>' + listaFirmada + '</strong><br>' +
        '<small style="color:#047857">La firma aparecerá en los documentos en unos momentos.</small>',
        'ok'
      );

      document.getElementById('codigo').value = '';
      badge.classList.add('visible');
      canvasWrap.classList.add('guardada');

    } catch(e) {
      mostrarMensaje('❌ Error al enviar. Verifica tu conexión e intenta de nuevo.', 'err');
    } finally {
      btn.disabled = false; btn.innerHTML = 'Registrar firma';
    }
  }

  // ── Resize ─────────────────────────────────────────────────
  window.addEventListener('resize', () => {
    const img = new Image(); img.src = canvas.toDataURL();
    img.onload = () => {
      initCanvas();
      if (haFirmado) ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    };
  });

  initCanvas();
  cargarFirmaGuardada();
</script>
</body>
</html>
